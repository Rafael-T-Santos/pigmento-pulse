server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha as chamadas /api para o backend Flask (porta 5000).
    # Ajuste o "upstream" conforme onde o Flask roda (veja o passo a passo):
    #   - Flask no HOST Linux:        http://host.docker.internal:5000
    #   - Flask em container Docker:  http://NOME_DO_CONTAINER:5000
    location /api/ {
        proxy_pass http://host.docker.internal:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache dos assets versionados gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
