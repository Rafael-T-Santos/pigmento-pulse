# Pigmento Pulse — frontend (nginx servindo o build + proxy /api -> api_sankhya:5000)
#
# ESTADO ATUAL: publicado direto na porta 8081 do host, sem tocar em quem já roda
#   no servidor (check-my-load é dono da 80/443; api_sankhya, da 5000).
#   Acesso: http://192.168.255.6:8081
#
#   O container entra na rede do compose da API para conseguir resolver o nome
#   "api_sankhya" no proxy_pass do nginx. Confira o nome real da rede com:
#       docker network ls | grep internal-api
#
# ESTADO ALVO (com Nginx Proxy Manager — ver docs/plano-reverse-proxy.md):
#   remova o bloco "ports", troque a rede para "proxy" (external) e crie o
#   Proxy Host tintas.empresa -> pigmento-frontend:80. O api_sankhya também deve
#   estar na rede "proxy" para o proxy_pass continuar resolvendo.

services:
  frontend:
    build: .
    container_name: pigmento-frontend
    restart: unless-stopped
    ports:
      - "8081:80"
    networks:
      - api

networks:
  api:
    name: internal-api-sankhya_default
    external: true
