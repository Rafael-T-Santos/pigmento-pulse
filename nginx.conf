server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A imagem oficial do nginx já liga gzip, mas só para text/html. Sem os tipos
    # abaixo, os estáticos desceriam crus.
    gzip on;
    gzip_types text/csv text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Entrega o .gz gerado no Dockerfile quando ele existe, em vez de comprimir na
    # hora. Vale para o formulas_iquine.csv: 23,6 MB viram 1,7 MB, e o nginx não
    # gasta CPU por requisição. Os demais estáticos (JS/CSS) não têm .gz pronto e
    # continuam saindo pelo `gzip on` acima.
    # O módulo vem compilado na imagem oficial (--with-http_gzip_static_module).
    gzip_static on;

    # O mime.types do nginx NÃO tem entrada para a extensão .csv — conferido no
    # fonte oficial. Sem este bloco o arquivo sai como application/octet-stream
    # (o default_type da imagem) e o gzip_types acima nunca casa: o CSV desceria
    # cru do mesmo jeito. `default_type` só vale quando a extensão não resolve o
    # tipo, que é exatamente o caso aqui, então declarar text/csv é seguro.
    location = /formulas_iquine.csv {
        default_type text/csv;
    }

    # SPA: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha as chamadas /api para o backend Flask (container api_sankhya,
    # na rede docker internal-api-sankhya_default, porta 5000).
    #
    # O endereço vai numa VARIÁVEL de propósito. Com o nome escrito direto no
    # proxy_pass, o nginx resolve o DNS uma única vez, ao iniciar, e guarda o IP
    # para sempre — aí todo redeploy da API (que recria o container com outro IP)
    # deixaria esta tela em 502 até alguém reiniciar o container do front. Pior:
    # se a API estivesse parada na hora do boot, o nginx nem subiria ("host not
    # found in upstream"). Com variável + resolver, o nome é resolvido a cada
    # requisição (cache de 10s) e a ordem de subida deixa de importar.
    # 127.0.0.11 é o DNS embutido do Docker, sempre disponível na rede do compose.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend http://api_sankhya:5000;
        # Sem parte de URI no destino, o caminho original (/api/...) é repassado
        # inalterado — igual ao proxy_pass literal que havia aqui.
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache dos assets versionados gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
