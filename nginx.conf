server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Encaminha as chamadas /api para o backend Flask (container api_sankhya,
    # na rede docker internal-api-sankhya_default, porta 5000).
    #
    # O endereço vai numa VARIÁVEL de propósito. Com o nome escrito direto no
    # proxy_pass, o nginx resolve o DNS uma única vez, ao iniciar, e guarda o IP
    # para sempre — aí todo redeploy da API (que recria o container com outro IP)
    # deixaria esta tela em 502 até alguém reiniciar o container do front. Pior:
    # se a API estivesse parada na hora do boot, o nginx nem subiria ("host not
    # found in upstream"). Com variável + resolver, o nome é resolvido a cada
    # requisição (cache de 10s) e a ordem de subida deixa de importar.
    # 127.0.0.11 é o DNS embutido do Docker, sempre disponível na rede do compose.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_backend http://api_sankhya:5000;
        # Sem parte de URI no destino, o caminho original (/api/...) é repassado
        # inalterado — igual ao proxy_pass literal que havia aqui.
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Cache dos assets versionados gerados pelo Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
